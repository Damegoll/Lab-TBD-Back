services:
  postgres:
    image: postgres:17
    container_name: lab-tbd-postgres
    environment:
      POSTGRES_DB: lab_tbd
      POSTGRES_USER: labtbd
      POSTGRES_PASSWORD: labtbd
    ports:
      # 5433 en tu PC -> 5432 dentro del contenedor. Se usa 5433 para no chocar
      # con un PostgreSQL instalado localmente, que normalmente ocupa el 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
